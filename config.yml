# GoSCAn configuration. CLI flags override these values.
# Tokens may be written here, but environment variables are safer for CI and shared repositories.

github:
  enabled: true
  token: "${GOSCAN_GITHUB_TOKEN}"

nvd:
  enabled: true
  api_key: "${GOSCAN_NVD_API_KEY}"

epss:
  enabled: true

# Accepted false positives. The key can be an advisory ID/alias, or module@ID
# to suppress only one dependency. Keep a reason so the exception is auditable.
ignore:
  show: false
  # GO-2026-1234: "vulnerable code path is not reachable in this application"
  # golang.org/x/net@CVE-2026-12345: "not affected on supported targets"

scan:
  fail_on: "none"
  epss_threshold: -1
  show_manifests: false
  timeout: "2m"

fix:
  run_tests: true
  timeout: "5m"

output:
  format: "terminal"
