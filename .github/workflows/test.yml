name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.26.6", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: make build
      - run: ./bin/goscan -v
      - run: ./bin/goscan --version
      - run: ./bin/goscan version
      - run: ./bin/goscan scan --no-github --no-nvd --no-epss .

  action-smoke:
    name: GitHub Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run GoSCAn through action.yml
        uses: ./
        with:
          fail-on: none
          no-github: "true"
          no-nvd: "true"
          no-epss: "true"
          show-manifests: "true"
          format: terminal
